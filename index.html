<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agent Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full bg-surface-void font-mono text-ink-base antialiased">
    <!-- h-dvh rather than h-full: a mobile browser shrinks the visual viewport
         when its address bar is showing, and a percentage height would push the
         panel off the bottom of the screen. -->
    <div class="flex h-dvh flex-col">
      <!-- Top bar -->
      <header
        class="flex h-11 shrink-0 items-center justify-between border-b border-surface-line px-3 sm:px-4"
      >
        <div class="flex min-w-0 items-baseline gap-3">
          <span class="text-[13px] font-semibold tracking-tight text-ink-bright">
            agent&#8203;·activity
          </span>
          <span
            class="hidden text-[10px] tracking-[0.18em] text-ink-faint uppercase lg:inline"
          >
            orchestrator / mock stream
          </span>
        </div>

        <div class="flex shrink-0 items-center gap-2">
          <span
            id="connection"
            class="hidden items-center gap-1.5 text-[10px] tracking-[0.14em] text-ink-dim uppercase sm:flex"
          >
            <span
              class="size-1.5 rounded-full bg-state-completed animate-state-pulse"
            ></span>
            streaming
          </span>
          <!-- Taller tap target on touch sizes; back to the dense height from sm up. -->
          <button
            id="toggle-pause"
            type="button"
            class="h-8 border border-surface-line px-3 text-[10px] tracking-[0.14em] text-ink-base uppercase transition hover:border-ink-faint hover:text-ink-bright focus:outline-none focus-visible:ring-1 focus-visible:ring-ink-dim sm:h-6 sm:px-2.5"
          >
            pause
          </button>
        </div>
      </header>

      <!-- Stacked on a phone, side by side from md up. -->
      <main class="flex min-h-0 flex-1 flex-col md:flex-row">
        <!-- 3D viewport. Agent labels are HTML, projected onto the node positions. -->
        <section
          id="stage"
          class="relative h-[56svh] w-full shrink-0 overflow-hidden md:h-auto md:min-h-0 md:min-w-0 md:flex-1"
        >
          <div id="viewport" class="absolute inset-0"></div>
          <div id="labels" class="pointer-events-none absolute inset-0"></div>

          <div
            class="pointer-events-none absolute bottom-3 left-4 hidden text-[10px] tracking-[0.14em] text-ink-faint uppercase sm:block"
          >
            dag / 6 agents / 6 edges
          </div>
        </section>

        <!-- Status panel -->
        <aside
          class="flex min-h-0 w-full flex-1 flex-col border-t border-surface-line bg-surface-panel md:w-105 md:flex-none md:border-t-0 md:border-l"
        >
          <!-- Run header -->
          <div class="shrink-0 border-b border-surface-line px-4 py-3">
            <div class="flex items-center justify-between">
              <span
                id="run-id"
                class="text-[11px] font-medium text-ink-bright tabular-nums"
                >run —</span
              >
              <span
                id="run-status"
                class="text-[10px] tracking-[0.14em] text-ink-dim uppercase"
                >idle</span
              >
            </div>
            <div
              class="mt-2 flex items-baseline justify-between text-[10px] text-ink-dim"
            >
              <span class="tracking-[0.14em] uppercase">elapsed</span>
              <span id="run-elapsed" class="text-ink-base tabular-nums">0.00s</span>
            </div>
            <!-- Completion bar: agents terminal / total. -->
            <div class="mt-2 h-px w-full bg-surface-line">
              <div
                id="run-progress"
                class="h-px w-0 bg-state-running transition-[width] duration-300"
              ></div>
            </div>
          </div>

          <!-- Agent roster. Stacked, the roster and the log split the panel
               and each scroll; side by side, the roster sits at its natural
               height and the log takes everything left over. -->
          <div
            class="flex min-h-0 flex-1 flex-col border-b border-surface-line md:flex-none"
          >
            <div
              class="flex shrink-0 items-center justify-between px-4 pt-3 pb-2 text-[10px] tracking-[0.18em] text-ink-faint uppercase"
            >
              <span>agents</span>
              <span id="roster-count" class="tabular-nums">0/6</span>
            </div>
            <ul
              id="roster"
              class="scroll-thin min-h-0 flex-1 overflow-y-auto pb-1 md:flex-none md:overflow-visible"
            ></ul>
          </div>

          <!-- Live log -->
          <div class="flex min-h-0 flex-1 flex-col">
            <div
              class="flex shrink-0 items-center justify-between px-4 pt-3 pb-2 text-[10px] tracking-[0.18em] text-ink-faint uppercase"
            >
              <span>event log</span>
              <span id="log-count" class="tabular-nums">0</span>
            </div>
            <ol
              id="log"
              class="scroll-thin min-h-0 flex-1 overflow-y-auto px-4 pb-3 text-[11px] leading-[1.45]"
            ></ol>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
